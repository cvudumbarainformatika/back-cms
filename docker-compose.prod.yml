version: '3.8'

services:
  # MariaDB Database (Replacement for MySQL)
  mysql:
    image: mariadb:10.11
    container_name: api-mysql-prod
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "33067:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--password=${DB_PASSWORD}"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: api-redis-prod
    restart: always
    volumes:
      - redis_prod_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mail Server (Self-Hosted)
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: mail.klikpdpi.com
    container_name: mailserver
    restart: always
    ports:
      - "25:25"    # SMTP (Incoming)
      - "587:587"  # SMTP (Submission/Outgoing)
      - "993:993"  # IMAP (Optional, for checking mail)
    volumes:
      - ./docker-data/dms/mail-data/:/var/mail/
      - ./docker-data/dms/mail-state/:/var/mail-state/
      - ./docker-data/dms/mail-logs/:/var/log/mail/
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
      - /etc/letsencrypt/:/etc/letsencrypt/:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_SPAMASSASSIN=1
      - ENABLE_CLAMAV=0 # Saving RAM
      - ENABLE_FAIL2BAN=1
      - ENABLE_POSTGREY=1
      - ONE_DIR=1
      - DMS_DEBUG=0
      - PERMIT_DOCKER=connected-networks
      - POSTFIX_INET_PROTOCOLS=ipv4
      - POSTFIX_SMTP_TLS_SECURITY_LEVEL=may
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/etc/letsencrypt/live/mail.klikpdpi.com/fullchain.pem
      - SSL_KEY_PATH=/etc/letsencrypt/live/mail.klikpdpi.com/privkey.pem
      - SPOOF_PROTECTION=0
    cap_add:
      - NET_ADMIN # Required for Fail2Ban
    networks:
      - app-network

  # Go Application (Production)
  app:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: starter-api:prod
    container_name: api-go-prod
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env.production
    environment:
      # Non-secret, structural configuration
      APP_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
      # Storage paths for all file types
      AVATAR_STORAGE_PATH: /app/storage/avatars
      STORAGE_THUMBNAILS_PATH: /app/storage/thumbnails
      STORAGE_BERITA_PATH: /app/storage/berita
      STORAGE_DOKUMEN_PATH: /app/storage/dokumen
      STORAGE_GALERI_PATH: /app/storage/galeri
      STORAGE_ATTACHMENT_PATH: /app/storage/attachments
    volumes:
      # Storage volumes for different file types - persistent across container rebuilds
      - /opt/apps/backend/storage:/app/storage
      # Mount mailserver logs for monitoring dashboard
      - ./docker-data/dms/mail-logs/:/var/log/mail/:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5



volumes:
  mysql_prod_data:
  redis_prod_data:
  # Storage volumes for different file types - persistent across container lifecycle
  storage_data:

networks:
  app-network:
    external: true
    name: gitlab_app-network
